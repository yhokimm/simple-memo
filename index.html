<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간단 메모장</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:system-ui,sans-serif;font-size:16px}main{max-width:580px;margin:32px auto;padding:20px}section,article{border:1px solid #ddd;border-radius:10px;padding:18px;margin:16px 0}input,textarea,button{font:inherit;padding:12px;border:1px solid #aaa;border-radius:6px}input,textarea{display:block;width:100%;margin:8px 0 16px}button{background:#f5f5f5;cursor:pointer;margin:4px 6px 4px 0}button:disabled{opacity:.5;cursor:wait}textarea{min-height:130px;resize:vertical}p{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:24px}small{color:#666}[hidden]{display:none!important}</style>
<main><h1>간단 메모장</h1><section id="auth"><form id="login"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required><label for="password">비밀번호 (6자 이상)</label><input id="password" type="password" minlength="6" autocomplete="current-password" required><button type="submit">로그인</button><button id="signup" type="button">회원가입</button></form></section><section id="app" hidden><p id="who"></p><button id="logout">로그아웃</button><form id="memo"><label for="content">메모 내용</label><textarea id="content" required></textarea><button type="submit">저장</button></form><h2>내 메모</h2><div id="list"></div></section><p id="status" role="status" aria-live="polite"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id);
let client,user,busy=false,version=0;
function status(text){$('status').textContent=text}
function lock(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value)}
function fail(e){status('오류: '+(e.message||'다시 시도해 주세요.'))}
async function load(){
const current=++version;
const {data,error}=await client.from('memos').select('id,content,created_at').eq('user_id',user.id).order('created_at',{ascending:false});
if(current!==version)return;if(error)throw error;
$('list').replaceChildren();
if(!data.length){$('list').textContent='저장된 메모가 없습니다.';return}
for(const row of data){const card=document.createElement('article'),p=document.createElement('p'),time=document.createElement('small'),del=document.createElement('button');p.textContent=row.content;time.textContent=new Date(row.created_at).toLocaleString('ko-KR');del.textContent='삭제';del.setAttribute('aria-label','메모 삭제');del.onclick=()=>run('삭제 중…',async()=>{const {error}=await client.from('memos').delete().eq('id',row.id).eq('user_id',user.id);if(error)throw error;await load();status('삭제했습니다.')});card.append(p,time,document.createElement('br'),del);$('list').append(card)}
}
async function render(session){user=session?.user;$('auth').hidden=!!user;$('app').hidden=!user;if(user){$('who').textContent=user.email;await load()}else{version++;$('list').replaceChildren();$('who').textContent='';$('content').value=''}}
async function run(message,fn){if(busy)return;lock(true);status(message);try{await fn()}catch(e){fail(e)}finally{lock(false)}}
async function authenticate(signup){if(!$('login').reportValidity())return;await run(signup?'가입 중…':'로그인 중…',async()=>{const credentials={email:$('email').value.trim(),password:$('password').value};const {data,error}=signup?await client.auth.signUp(credentials):await client.auth.signInWithPassword(credentials);if(error)throw error;if(!data.session)throw new Error('가입됐지만 이메일 확인이 필요합니다.');$('password').value='';await render(data.session);status(signup?'가입하고 로그인했습니다.':'로그인했습니다.')})}
$('login').onsubmit=e=>{e.preventDefault();authenticate(false)};
$('signup').onclick=()=>authenticate(true);
$('logout').onclick=()=>run('로그아웃 중…',async()=>{const {error}=await client.auth.signOut();if(error)throw error;await render(null);status('로그아웃했습니다.')});
$('memo').onsubmit=e=>{e.preventDefault();const content=$('content').value.trim();if(!content){status('메모 내용을 입력해 주세요.');return}run('저장 중…',async()=>{const {error}=await client.from('memos').insert({user_id:user.id,content});if(error)throw error;$('content').value='';await load();status('저장했습니다.')})};
(async()=>{try{if(!window.supabase)throw new Error('연결 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.');client=window.supabase.createClient('https://jghvszgohlwfogjqsicg.supabase.co','sb_publishable_tVyp-if5rNmylP0uqs0mCw_kpxLQ9eQ',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')render(null).catch(fail)});const {data,error}=await client.auth.getSession();if(error)throw error;await render(data.session)}catch(e){fail(e)}})();
</script></html>
